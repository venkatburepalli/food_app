services:
  db:
    image: mysql:8.4
    container_name: food-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fooddb
      MYSQL_USER: fooduser
      MYSQL_PASSWORD: foodpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - food_db_data:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: food-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/fooddb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  food_db_data:
