<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodHub</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}.hero{background:#e85d04;color:white;padding:28px;text-align:center}.hero h1{margin:0}.container{max-width:1100px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px #0001}.tag{display:inline-block;background:#fff1e6;color:#e85d04;padding:5px 9px;border-radius:20px;font-size:12px}.price{font-size:22px;font-weight:bold}.button{background:#e85d04;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer}.status{margin:15px 0;font-weight:bold}</style></head>
<body><div class="hero"><h1>🍴 FoodHub</h1><p>Fresh food. Simple ordering.</p></div><div class="container"><div class="status" id="status">Loading menu...</div><div class="grid" id="foods"></div></div>
<script>async function load(){try{const r=await fetch('/api/foods/available');if(!r.ok)throw Error();const foods=await r.json();document.getElementById('status').textContent=foods.length+' items available';document.getElementById('foods').innerHTML=foods.map(f=>`<div class="card"><span class="tag">${f.category}</span><h2>${f.name}</h2><p>${f.description}</p><p class="price">₹${f.price.toFixed(2)}</p><button class="button" onclick="order('${f.name}')">Add to Cart</button></div>`).join('')}catch(e){document.getElementById('status').textContent='Unable to load menu. Check database connection.'}}function order(n){alert(n+' added to cart!')}load();</script></body></html>
